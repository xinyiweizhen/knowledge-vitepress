<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1100 600">
  <!-- Client & Server 框线 -->
  <rect x="50" y="50" width="400" height="500" fill="#f9f9f9"/>
  <rect x="550" y="50" width="400" height="500" fill="#f9f9f9"/>

  <text x="200" y="40" text-anchor="middle" fill="black">Client (Browser)</text>
  <text x="750" y="40" text-anchor="middle" fill="black">Server (Web Server)</text>

  <!-- 步骤 -->
  <text x="320" y="80"  fill="black">1. ClientHello</text>
  <line x1="450" y1="80" x2="550" y2="80" marker-end="url(#arrow)" stroke="#333" stroke-width="2" />

  <text x="560" y="120" fill="black">2. ServerHello</text>
  <line x1="550" y1="120" x2="450" y2="120" marker-end="url(#arrow)" stroke="#333" stroke-width="2" />

  <text x="560" y="160" fill="black">3. Certificate</text>
  <line x1="550" y1="160" x2="450" y2="160" marker-end="url(#arrow)" stroke="#333" stroke-width="2" />

  <text x="560" y="200" fill="black">4. ServerKeyExchange (可选)</text>
  <line x1="550" y1="200" x2="450" y2="200" marker-end="url(#arrow)" stroke="#333" stroke-width="2" />

  <text x="560" y="240" fill="black">5. ServerHelloDone</text>
  <line x1="550" y1="240" x2="450" y2="240" marker-end="url(#arrow)" stroke="#333" stroke-width="2" />

  <text x="280" y="280" fill="black">6. ClientKeyExchange</text>
  <line x1="450" y1="280" x2="550" y2="280" marker-end="url(#arrow)" stroke="#333" stroke-width="2" />

  <text x="300" y="320" fill="black">7. ChangeCipherSpec</text>
  <line x1="450" y1="320" x2="550" y2="320" marker-end="url(#arrow)" stroke="#333" stroke-width="2" />

  <text x="355" y="360" fill="black">8. Finished</text>
  <line x1="450" y1="360" x2="550" y2="360" marker-end="url(#arrow)" stroke="#333" stroke-width="2" />

  <text x="560" y="400" fill="black">9. ChangeCipherSpec</text>
  <line x1="550" y1="400" x2="450" y2="400" marker-end="url(#arrow)" stroke="#333" stroke-width="2" />

  <text x="560" y="440" fill="black">10. Finished</text>
  <line x1="550" y1="440" x2="450" y2="440" marker-end="url(#arrow)" stroke="#333" stroke-width="2" />

  <text x="300" y="480" fill="black">[加密应用数据开始]</text>
  <text x="560" y="480" fill="black">[加密应用数据开始]</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
</svg>
